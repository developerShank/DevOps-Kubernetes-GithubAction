name: Demo CI Env Secrets
on: 
  push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: say hello
        run: echo "Hello Shashank from second yml file!"
    
      - name: Install
        env: 
          APP_ENV: dev
          DB_PASSWORD: ${{secrets.DB_PASSWORD}}
        run: echo "Hello Shashank, Your environment is $APP_ENV using $DB_PASSWORD"