name: Demo CI Env Secrets
on: 
  push
env: 
  GLOBAL_APP_ENV: GlobalDev
jobs:
  build:
    runs-on: ubuntu-latest
    env: 
      JOB_APP_ENV: JOB_dev
    steps:
      - name: say hello
        run: echo "Hello Shashank from second yml file!"
    
      - name: Install
        env: 
          APP_ENV: dev
          DB_PASSWORD: ${{secrets.DB_PASSWORD}}
        run: echo "Hello Shashank, Your environment is $APP_ENV using $DB_PASSWORD, $JOB_APP_ENV and $GLOBAL_APP_ENV"

      - name: Create demo file
        run: |
          echo "Hello from CI pipeliene" > demo.txt
          echo "File created successfully"


      - name: Upload Demo
        uses: actions/upload-artifact@v7
        with:
            name: build-demo-artificate
            path: .