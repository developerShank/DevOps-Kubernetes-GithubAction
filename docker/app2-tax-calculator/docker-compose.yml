services:

  service-a:
    build: ./python/service-a
    #image: shashankmohan/tax-service-a:01
    ports:
      - "3100:3000"
    depends_on:
      - service-b
    environment:
      - TAX_SERVICE_URL= http://service-b:4000
      - FRONTEND_URL= http://localhost:5173


  service-b:
    build: ./python/service-b
    #image: shashankmohan/tax-service-b:01
    ports:
      - "3200:4000"
  frontend:
    build: ./tax-calculator-frontend
    ports:
      - "5173:80"
    depends_on:
      - service-a