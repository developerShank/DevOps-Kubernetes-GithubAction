apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp1-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: nginx
          env:
            - name: ENV_VALUE
              value: "Hello from app.yaml"
            - name : DB_PASSWORD
              value: "info"
          # env:
          #   - name: APP_MESSAGE
          #     valueFrom:
          #       configMapKeyRef:
          #         name: app-config
          #         key: APP_MESSAGE
          #   - name: DB_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: db-secret
          #         key: DB_PASSWORD
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: myapp1-hello
spec:
  selector:
    app: myapp1-hello
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000
