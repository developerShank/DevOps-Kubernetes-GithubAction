apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp1-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp1-hello
  template:
    metadata:
      labels:
        app: myapp1-hello
    spec:
      containers:
        - name: myapp
          image: embarkx/hello-spring
          # env:
          #   - name: ENV_VALUE
          #     value: "Hello from app.yaml"
          #   - name : DB_PASSWORD
          #     value: "info"
          env:
            - name: ENV_VALUE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_MESSAGE
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: myapp1-hello
spec:
  selector:
    app: myapp1-hello
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 32000
